<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<!-- Promo «Il dato di oggi» v3 (stati / storie / Reel), 1080×1920, 21 s, a tempo con il brano Envato (120 bpm, drop a 4,0 s).
     A 0–4 «Il dato è tratto™» → «Il dato di oggi»  ·  B 4–11 i 7 siti scorrono in un portatile, uno per battuta doppia
     C 11–14 persona al computer con il telefono (filmato Envato)  ·  D 14–19 telefono: canale «Il dato è tratto™», tocco su «Iscriviti»
     E 19–21 chiusura. Le risorse Envato (promo2/clip, musica) NON vanno nel repository: licenza d'uso, non ridistribuibili. -->
<style>
@font-face{font-family:Archivo;src:url(archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Newsreader;src:url(news.woff2) format("woff2");font-weight:400}
html,body{margin:0;background:#F4F7FB}canvas{display:block}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<img id="logo" src="%%LOGO%%" alt="" style="display:none">
<script>
var W=1080,H=1920,cv=document.getElementById('cv'),ctx=cv.getContext('2d'),FPS=30;
var G=window.GIORNI||[];
function hex(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function cl(x){return x<0?0:x>1?1:x;} function ease(t){t=cl(t);return t*t*(3-2*t);}
function bez(t){t=cl(t);var a=0,b=1;for(var i=0;i<22;i++){var m=(a+b)/2,x=3*m*(1-m)*(1-m)*.2+3*m*m*(1-m)*.2+m*m*m;if(x<t)a=m;else b=m;}var u=(a+b)/2;return 3*u*(1-u)*(1-u)*.8+3*u*u*(1-u)+u*u*u;}
function snap(t){t=cl(t);return 1-Math.pow(1-t,4);}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c,al){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(al==null?1:al)+')';}
function font(px,peso){ctx.font=(peso||900)+' '+px+'px Archivo';}
var NAVY=[11,31,58], TENUE=[84,98,122], ARANCIO=[245,166,35], PILL2=[0,51,102], WA=[37,211,102];
function img(src){var i=new Image();i.src=src;return i;}
var SITI=[];for(var k=1;k<=7;k++)SITI.push(img('promo2/sito'+k+'.jpg'));
var CLIP=[];for(var k=1;k<=96;k++)CLIP.push(img('promo2/clip/f'+String(k).padStart(3,'0')+'.jpg'));
var POST=img('promo2/post.jpg');

/* tempi */
var T_CAMBIO=1.5,ST_OUT=.018,ST_IN=.022,TR=.5,OP=.4,VECCHIA='è tratto',NUOVA='di oggi';
var T_SWAP=T_CAMBIO+.26+VECCHIA.length*ST_OUT, T_SU=3.0, T_B=4.0, SLOT=1.0, T_C=11.0, T_D=14.0, T_TAP=16.5, T_E=19.0, TOT=21.0;
var FRAMES=Math.round(TOT*FPS), FS=150, AV={};
function av(s){if(AV[s])return AV[s];font(FS);var o=[];for(var i=0;i<=s.length;i++)o.push(ctx.measureText(s.slice(0,i)).width);return AV[s]=o;}
function titolo(t){
  var a1=av(VECCHIA),a2=av(NUOVA),pad=.42*FS,hP=FS*1.16,wV=a1[a1.length-1]+2*pad,wN=a2[a2.length-1]+2*pad;
  var wp=wV+(wN-wV)*bez((t-T_CAMBIO-.15)/(T_SWAP-T_CAMBIO+.35)),colP=mix(ARANCIO,PILL2,ease((t-T_SWAP)/.6));
  font(FS*1.08);ctx.textAlign='center';ctx.fillStyle=rgb(NAVY);ctx.fillText('Il dato',0,-40);
  var px=-wp/2,py=10,r=hP/2;ctx.fillStyle=rgb(colP);ctx.beginPath();ctx.roundRect(px,py,wp,hP,r);ctx.fill();
  ctx.save();ctx.beginPath();ctx.roundRect(px,py,wp,hP,r);ctx.clip();font(FS);ctx.textAlign='left';var base=py+hP*.745;
  if(t<T_SWAP){ctx.fillStyle='#071020';for(var k=0;k<VECCHIA.length;k++){var t0=T_CAMBIO+k*ST_OUT,e=bez((t-t0)/TR);ctx.globalAlpha=1-cl((t-t0)/OP);ctx.fillText(VECCHIA[k],px+pad+a1[k],base-1.1*hP*e);}}
  else{ctx.fillStyle='#FFFFFF';for(var k=0;k<NUOVA.length;k++){var t0=T_SWAP+.034+k*ST_IN,e=bez((t-t0)/TR);ctx.globalAlpha=cl((t-t0)/OP);ctx.fillText(NUOVA[k],px+pad+a2[k],base+1.1*hP*(1-e));}}
  ctx.globalAlpha=1;ctx.restore();
  var tm=1-ease((t-T_CAMBIO)/.35);if(tm>0){font(FS*.34,800);ctx.globalAlpha=tm;ctx.fillStyle=rgb(NAVY);ctx.fillText('™',px+wp+8,py+FS*.42);ctx.globalAlpha=1;}
}
function sfondo(c1,c2){var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgb(c1));g.addColorStop(1,rgb(c2));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
var seed=5;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
var P=[];for(var i=0;i<700;i++)P.push({x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*.6,vy:(rnd()-.5)*.6});
function puntini(a){ctx.fillStyle='rgba(11,31,58,'+(.10*a)+')';for(var i=0;i<P.length;i++){var p=P[i];p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H;ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,6.283);ctx.fill();}}

/* B: portatile con il sito che scorre */
var LX=70,LY=760,LW=940,LH=600,BZ=22;
function portatile(){
  ctx.shadowColor='rgba(11,31,58,.25)';ctx.shadowBlur=60;ctx.shadowOffsetY=30;
  ctx.fillStyle='#1B222D';ctx.beginPath();ctx.roundRect(LX,LY,LW,LH,30);ctx.fill();ctx.shadowColor='transparent';
  ctx.fillStyle='#2A3240';ctx.beginPath();ctx.moveTo(LX-60,LY+LH+6);ctx.lineTo(LX+LW+60,LY+LH+6);ctx.lineTo(LX+LW+20,LY+LH+44);ctx.lineTo(LX-20,LY+LH+44);ctx.closePath();ctx.fill();
  ctx.fillStyle='#3A4352';ctx.beginPath();ctx.roundRect(W/2-90,LY+LH+6,180,14,7);ctx.fill();
}
function schermo(i,u,dx){ // u = avanzamento dello scorrimento 0..1
  var sx=LX+BZ,sy=LY+BZ,sw=LW-2*BZ,sh=LH-2*BZ,im=SITI[i];
  ctx.save();ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,10);ctx.clip();
  ctx.fillStyle='#fff';ctx.fillRect(sx,sy,sw,sh);
  var ih=im.naturalHeight*sw/im.naturalWidth, off=(ih-sh)*ease(u);
  ctx.drawImage(im,sx+dx,sy-off,sw,ih);ctx.restore();
}

/* D: telefono con il canale */
var PW=620,PH=1260,PXc=W/2,PYc=1080;
function telefono(t,y0){
  var x=PXc-PW/2,y=y0;
  ctx.shadowColor='rgba(11,31,58,.30)';ctx.shadowBlur=70;ctx.shadowOffsetY=30;
  ctx.fillStyle='#111';ctx.beginPath();ctx.roundRect(x,y,PW,PH,92);ctx.fill();ctx.shadowColor='transparent';
  var sx=x+20,sy=y+20,sw=PW-40,sh=PH-40;
  ctx.save();ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,74);ctx.clip();
  ctx.fillStyle='#FFFFFF';ctx.fillRect(sx,sy,sw,sh);
  // barra di stato e isola
  ctx.fillStyle='#000';ctx.beginPath();ctx.roundRect(PXc-80,sy+18,160,46,23);ctx.fill();
  font(26,700);ctx.textAlign='left';ctx.fillStyle='#000';ctx.fillText('9:41',sx+50,sy+52);
  // intestazione
  font(34,600);ctx.fillStyle='#000';ctx.fillText('‹',sx+30,sy+130);
  font(30,700);ctx.textAlign='center';ctx.fillText('Info canale',PXc,sy+128);
  // avatar
  ctx.fillStyle=rgb([20,28,42]);ctx.beginPath();ctx.arc(PXc,sy+290,110,0,6.283);ctx.fill();
  font(46,900);ctx.fillStyle='#fff';ctx.fillText('Il dato',PXc,sy+278);ctx.fillText('è tratto',PXc,sy+326);
  ctx.fillStyle=rgb(ARANCIO);ctx.fillRect(PXc-30,sy+344,60,8);
  font(44,800);ctx.fillStyle='#000';ctx.fillText('Il dato è tratto™',PXc,sy+470);
  font(28,500);ctx.fillStyle='#667085';ctx.fillText('Canale · 1 mila follower',PXc,sy+515);
  ctx.font='400 28px Newsreader';ctx.fillStyle='#344054';
  ['I numeri che contano, su dati ufficiali.','Ogni giorno «Il dato di oggi», con la fonte.','Ogni martedì la settimana in numeri.'].forEach(function(r,j){ctx.fillText(r,PXc,sy+575+j*38);});
  // pulsante Iscriviti → Iscritto
  var tp=t-T_TAP, fatto=tp>0.12, bw=sw-100, bx=PXc-bw/2, by=sy+700, pr=1-.04*Math.sin(Math.PI*cl(tp/.25));
  ctx.save();ctx.translate(PXc,by+45);ctx.scale(pr,pr);ctx.translate(-PXc,-(by+45));
  if(!fatto){ctx.fillStyle=rgb(WA);ctx.beginPath();ctx.roundRect(bx,by,bw,90,45);ctx.fill();font(36,800);ctx.fillStyle='#fff';ctx.fillText('Iscriviti',PXc,by+58);}
  else{ctx.lineWidth=4;ctx.strokeStyle=rgb(WA);ctx.fillStyle='#E9FBF0';ctx.beginPath();ctx.roundRect(bx,by,bw,90,45);ctx.fill();ctx.stroke();font(36,800);ctx.fillStyle=rgb([8,120,60]);ctx.fillText('Iscritto',PXc+24,by+58);ctx.lineWidth=7;ctx.lineCap='round';ctx.strokeStyle=rgb([8,120,60]);ctx.beginPath();ctx.moveTo(PXc-100,by+46);ctx.lineTo(PXc-86,by+60);ctx.lineTo(PXc-62,by+32);ctx.stroke();}
  ctx.restore();
  // ultimo aggiornamento
  font(26,700);ctx.textAlign='left';ctx.fillStyle='#667085';ctx.fillText('AGGIORNAMENTI',sx+50,sy+870);
  var thW=sw-100,thH=thW*0.42;ctx.save();ctx.beginPath();ctx.roundRect(sx+50,sy+895,thW,thH,26);ctx.clip();
  if(POST.naturalWidth){var s=thW/POST.naturalWidth;ctx.drawImage(POST,sx+50,sy+895-(POST.naturalHeight*s*.18),thW,POST.naturalHeight*s);}ctx.restore();
  font(26,600);ctx.fillStyle='#344054';ctx.fillText('Il dato di oggi · 21,1% dei laureati',sx+50,sy+895+thH+44);
  ctx.restore();
  // dito che tocca
  var tf=t-(T_TAP-.5);
  if(tf>0&&tf<1.4){var fx=PXc+60,fy=by+45+110*(1-snap(tf/.5)),a=cl(tf/.2)*(1-cl((tf-1.0)/.4));
    if(tp>0){ctx.strokeStyle='rgba(37,211,102,'+(.6*(1-cl(tp/.5)))+')';ctx.lineWidth=6;ctx.beginPath();ctx.arc(PXc,by+45,40+220*snap(tp/.5),0,6.283);ctx.stroke();}
    ctx.fillStyle='rgba(255,255,255,'+(.85*a)+')';ctx.strokeStyle='rgba(11,31,58,'+(.35*a)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(fx,fy,38,0,6.283);ctx.fill();ctx.stroke();}
}

function frame(f){
  var t=f/FPS;
  if(t<T_B){ // A
    sfondo([233,240,250],[247,249,252]);puntini(1);
    var u=bez((t-T_SU)/.6),sc=1-.6*u,cy=930+(260-930)*u;
    ctx.save();ctx.translate(W/2,cy);ctx.scale(sc,sc);titolo(t);ctx.restore();
    var a=ease((t-3.3)/.4);if(a>0){ctx.globalAlpha=a;ctx.textAlign='center';ctx.font='400 44px Newsreader';ctx.fillStyle=rgb(TENUE);ctx.fillText('7 osservatori, un dato al giorno',W/2,470);ctx.globalAlpha=1;}
  } else if(t<T_C){ // B
    var k=Math.min(6,Math.floor((t-T_B)/SLOT)),loc=t-T_B-k*SLOT,g=G[k],gn=G[Math.min(6,k+1)];
    var tr=k<6?snap((loc-.82)/.18):0;
    sfondo(mix(hex(g.sfondo),hex(gn.sfondo),tr),mix(hex(g.fondo),hex(gn.fondo),tr));puntini(.6);
    // testata piccola
    ctx.save();ctx.translate(W/2,190);ctx.scale(.4,.4);titolo(99);ctx.restore();
    // etichetta del giorno
    var lab=function(gg,ii,al,dx){ctx.globalAlpha=al;ctx.textAlign='center';font(30,800);ctx.fillStyle=rgb(hex(gg.colScuro));ctx.fillText((ii+1)+' / 7',W/2+dx,410);
      font(120,900);ctx.fillText(gg.giorno,W/2+dx,540);ctx.font='400 46px Newsreader';ctx.fillStyle=rgb(NAVY);ctx.fillText(gg.portale,W/2+dx,610);
      font(40,700);var sw=ctx.measureText(gg.sito).width+70;ctx.fillStyle=rgb(hex(gg.colScuro));ctx.beginPath();ctx.roundRect(W/2+dx-sw/2,648,sw,64,32);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(gg.sito,W/2+dx,693);ctx.globalAlpha=1;};
    lab(g,k,1-tr,-W*tr);if(tr>0)lab(gn,k+1,tr,W*(1-tr));
    portatile();schermo(k,cl(loc/.85),-LW*tr);if(tr>0)schermo(k+1,0,LW*(1-tr));
  } else if(t<T_D){ // C
    var fi=Math.min(95,Math.floor((t-T_C)*30)),im=CLIP[fi],z=1+.08*((t-T_C)/3);
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.drawImage(im,-W/2,-H/2,W,H);ctx.restore();
    var gr=ctx.createLinearGradient(0,H*.55,0,H);gr.addColorStop(0,'rgba(11,31,58,0)');gr.addColorStop(1,'rgba(11,31,58,.75)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';font(84,900);
    var a1=snap((t-T_C-.1)/.4),a2=snap((t-T_C-1.0)/.4);
    ctx.globalAlpha=a1;ctx.fillStyle='#fff';ctx.fillText('Un dato al giorno.',W/2,1500+30*(1-a1));
    ctx.globalAlpha=a2;ctx.fillStyle=rgb(WA);ctx.fillText('Sul tuo telefono.',W/2,1610+30*(1-a2));ctx.globalAlpha=1;
    var fl=cl(1-(T_D-t)/.15);if(fl>0){ctx.fillStyle='rgba(255,255,255,'+fl+')';ctx.fillRect(0,0,W,H);}
  } else if(t<T_E){ // D
    sfondo([233,240,250],[247,249,252]);puntini(.6);
    var u=snap((t-T_D)/.7),y0=H+40-(H+40-(PYc-PH/2+60))*u;
    ctx.textAlign='center';var a=ease((t-T_D-.3)/.4);ctx.globalAlpha=a;font(52,800);ctx.fillStyle=rgb(NAVY);ctx.fillText('Iscriviti al canale WhatsApp',W/2,250);
    font(64,900);ctx.fillStyle=rgb(PILL2);ctx.fillText('«Il dato è tratto™»',W/2,330);ctx.globalAlpha=1;
    telefono(t,y0);
    var wf=1-cl((t-T_D)/.25);if(wf>0){ctx.fillStyle='rgba(255,255,255,'+wf+')';ctx.fillRect(0,0,W,H);}
  } else { // E
    sfondo([233,240,250],[247,249,252]);puntini(.6);
    var a=snap((t-T_E)/.5);ctx.globalAlpha=a;
    ctx.save();ctx.translate(W/2,820);ctx.scale(.62,.62);titolo(99);ctx.restore();
    ctx.textAlign='center';ctx.font='400 48px Newsreader';ctx.fillStyle=rgb(TENUE);ctx.fillText('Ogni giorno un numero sull\'Italia, con la fonte.',W/2,1060);
    var lg=document.getElementById('logo'),lh=120,lw=lg.naturalWidth*lh/lg.naturalHeight;ctx.drawImage(LOGO(),W/2-lw/2,1220,lw,lh);
    font(40,700);ctx.fillStyle=rgb(NAVY);ctx.fillText('troisiricerche.net',W/2,1440);ctx.globalAlpha=1;
  }
  if(t<T_E){var lg=document.getElementById('logo'),lh=58,lw=lg.naturalWidth*lh/lg.naturalHeight;
    if(t<T_C||t>=T_D){ctx.drawImage(LOGO(),W-60-lw,H-150,lw,lh);}}
}
var _lg=null;function LOGO(){if(_lg)return _lg;var im=document.getElementById('logo'),o=document.createElement('canvas');o.width=im.naturalWidth;o.height=im.naturalHeight;var c=o.getContext('2d');c.drawImage(im,0,0);var d=c.getImageData(0,0,o.width,o.height);for(var i=0;i<d.data.length;i+=4){if(d.data[i]>200&&d.data[i+1]>200&&d.data[i+2]>200){d.data[i]=11;d.data[i+1]=31;d.data[i+2]=58;}}c.putImageData(d,0,0);return _lg=o;}
window.FRAMES=FRAMES;
function caricata(i){return new Promise(function(r){i.complete&&i.naturalWidth?r():(i.onload=r,i.onerror=r);});}
window.pronto=Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('400 50px Newsreader'),caricata(document.getElementById('logo')),caricata(POST)].concat(SITI.map(caricata)).concat(CLIP.map(caricata)));
</script></body></html>
