<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<!-- sfondo: colore del giorno (campo "sfondo" in dati.json), sfuma verso il blu notte in basso.
     «Il dato di oggi» – video quotidiano 1080×1920 (Reel, LinkedIn, Facebook, WhatsApp).
     «Il dato [è tratto™]» → la pillola cambia parola in «di oggi» con lo stesso movimento del sito ildatoetratto.it
     (lettere che escono verso l'alto, una alla volta; le nuove entrano dal basso), poi i puntini compongono il numero. -->
<style>
@font-face{font-family:Archivo;src:url(archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Newsreader;src:url(news.woff2) format("woff2");font-weight:400}
html,body{margin:0;background:#050B17}
canvas{display:block}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<img id="logo" src="%%LOGO%%" alt="" style="display:none">
<script>
var W=1080,H=1920,cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var FPS=30,N=4200,P=[];
var D=window.DATI||{data:'Mercoledì 14 ottobre 2026',n:'21,1%',col:'#41DDA0',tema:'LAVORO',riga:'',barre:[],fonte:''};
function hex(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
var TEMA=hex(D.col), ARANCIO=[245,166,35], BIANCO=[237,242,250], TENUE=[148,167,195], NAVY=[40,90,160];
var seed=11; function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
function cl(x){return x<0?0:x>1?1:x;}
function ease(t){t=cl(t);return t*t*(3-2*t);}
// cubic-bezier(.2,.8,.2,1) del sito, approssimata
function bez(t){t=cl(t);var a=0,b=1;for(var i=0;i<22;i++){var m=(a+b)/2,x=3*m*(1-m)*(1-m)*.2+3*m*m*(1-m)*.2+m*m*m;if(x<t)a=m;else b=m;}var u=(a+b)/2;return 3*u*(1-u)*(1-u)*.8+3*u*u*(1-u)*1+u*u*u;}
function mix(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c,al){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(al==null?1:al)+')';}

/* ---- tempi (secondi) ---- */
var T_CAMBIO=1.9;                 // le lettere di «è tratto» iniziano a uscire
var T_SU=3.7, T_NUM=3.9, T_TESTO=4.9, T_FINE=12.2, TOT=15.6;
var FRAMES=Math.round(TOT*FPS);

/* ---- puntini ---- */
function testo(str,col,a){
  var o=document.createElement('canvas'),c=o.getContext('2d'),fs=220;o.width=2000;o.height=320;
  c.font='900 '+fs+'px Archivo';try{c.fontStretch='expanded';}catch(e){}
  c.fillText(str,10,fs);
  var d=c.getImageData(0,0,o.width,o.height).data,pts=[],x0=1e9,y0=1e9,x1=-1,y1=-1,st=6;
  for(var y=0;y<o.height;y+=st)for(var x=0;x<o.width;x+=st){if(d[(y*o.width+x)*4+3]>128){pts.push([x,y]);if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  var s=Math.min(a.w/(x1-x0+1),a.h/(y1-y0+1)),ox=a.x+(a.w-(x1-x0)*s)/2,oy=a.y+(a.h-(y1-y0)*s)/2;
  return pts.map(function(q){return {x:ox+(q[0]-x0)*s,y:oy+(q[1]-y0)*s,c:col};});
}
function marchio(){ // tre barre + punto, come nel Reel del martedì
  var lato=400,ox=(W-lato)/2,oy=560,s=lato/64,out=[];
  function rett(x,y,w,h,col,p){for(var yy=y;yy<y+h;yy+=p)for(var xx=x;xx<x+w;xx+=p)out.push({x:ox+xx*s,y:oy+yy*s,c:col});}
  rett(15,34,8,16,ARANCIO,1.3);rett(28,24,8,26,BIANCO,1.3);rett(41,14,8,36,ARANCIO,1.3);
  for(var r=0;r<=4;r+=.92){var n=Math.max(1,Math.round(r*6));for(var k=0;k<n;k++){var g=k/n*6.283;out.push({x:ox+(19+Math.cos(g)*r)*s,y:oy+(20+Math.sin(g)*r)*s,c:BIANCO});}}
  for(var t=0;t<232;t+=1.2){var q=t%58,l=Math.floor(t/58),x=[3+q,61,61-q,3][l],y=[3,3+q,61,61-q][l];out.push({x:ox+x*s,y:oy+y*s,c:NAVY});}
  return out;
}
for(var i=0;i<N;i++)P.push({x:rnd()*W,y:rnd()*H,vx:(rnd()-.5)*1.2,vy:(rnd()-.5)*1.2,tx:null,ty:null,r:TENUE.slice(),t:TENUE.slice(),a:.16,ta:.16,rad:1.5,rt:1.5,rit:0});
function forma(pts,f){
  for(var i=pts.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var z=pts[i];pts[i]=pts[j];pts[j]=z;}
  if(pts.length>N)pts.length=N;
  for(var n=0;n<N;n++){var p=P[n],q=pts[n];p.rit=f+Math.floor(rnd()*12);
    if(q){p.tx=q.x;p.ty=q.y;p.t=q.c;p.ta=1;p.rt=2.6;}
    else{p.tx=null;p.t=TENUE;p.ta=.13;p.rt=1.4;p.vx=(rnd()-.5)*1.2;p.vy=(rnd()-.5)*1.2;}}
}
function passo(f){
  for(var s=0;s<2;s++)for(var i=0;i<N;i++){var p=P[i];
    if(p.tx!==null&&f>=p.rit){p.vx+=(p.tx-p.x)*.045;p.vy+=(p.ty-p.y)*.045;p.vx*=.8;p.vy*=.8;}
    p.x+=p.vx;p.y+=p.vy;
    if(p.tx===null){if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;}
    for(var c=0;c<3;c++)p.r[c]+=(p.t[c]-p.r[c])*.08;p.a+=(p.ta-p.a)*.06;p.rad+=(p.rt-p.rad)*.08;}
}

/* ---- la pillola che cambia parola ---- */
var FS=150, VECCHIA='è tratto', NUOVA='di oggi';
var ST_OUT=.018, ST_IN=.022, TR=.5, OP=.4;           // stessi tempi del sito
var T_SWAP=T_CAMBIO+.26+VECCHIA.length*ST_OUT;
function font(px,peso){ctx.font=(peso||900)+' '+px+'px Archivo';try{ctx.fontStretch='normal';}catch(e){}}
function avanzamenti(str){font(FS);var out=[],x=0;for(var i=0;i<str.length;i++){out.push(x);x=ctx.measureText(str.slice(0,i+1)).width;}out.push(x);return out;}
var AV_V, AV_N;
function titolo(t){ // disegnato con origine al centro del blocco (0,0)
  if(!AV_V){AV_V=avanzamenti(VECCHIA);AV_N=avanzamenti(NUOVA);}
  var pad=.42*FS, hP=FS*1.16, wV=AV_V[AV_V.length-1]+2*pad, wN=AV_N[AV_N.length-1]+2*pad;
  var wp=wV+(wN-wV)*bez((t-T_CAMBIO-.15)/(T_SWAP-T_CAMBIO+.35));
  var colP=mix(ARANCIO,TEMA,ease((t-T_SWAP)/.6));
  // riga 1
  font(FS*1.08);ctx.textAlign='center';ctx.fillStyle=rgb(BIANCO);ctx.fillText('Il dato',0,-40);
  // pillola
  var px=-wp/2, py=10, r=hP/2;
  ctx.fillStyle=rgb(colP);ctx.beginPath();ctx.roundRect(px,py,wp,hP,r);ctx.fill();
  ctx.save();ctx.beginPath();ctx.roundRect(px,py,wp,hP,r);ctx.clip();
  font(FS);ctx.textAlign='left';ctx.fillStyle='#071020';
  var base=py+hP*.745;
  if(t<T_SWAP){for(var k=0;k<VECCHIA.length;k++){var t0=T_CAMBIO+k*ST_OUT,e=bez((t-t0)/TR),a=1-cl((t-t0)/OP);
      ctx.globalAlpha=a;ctx.fillText(VECCHIA[k],px+pad+AV_V[k],base-1.1*hP*e);}}
  else{for(var k=0;k<NUOVA.length;k++){var t0=T_SWAP+.034+k*ST_IN,e=bez((t-t0)/TR),a=cl((t-t0)/OP);
      ctx.globalAlpha=a;ctx.fillText(NUOVA[k],px+pad+AV_N[k],base+1.1*hP*(1-e));}}
  ctx.globalAlpha=1;ctx.restore();
  // ™ accanto alla pillola, solo per «è tratto»
  var tm=1-ease((t-T_CAMBIO)/.35);
  if(tm>0){font(FS*.34,800);ctx.globalAlpha=tm;ctx.fillStyle=rgb(BIANCO);ctx.fillText('™',px+wp+8,py+FS*.42);ctx.globalAlpha=1;}
}
function a_capo(txt,maxw){var w=txt.split(' '),r=[],l='';w.forEach(function(x){var t=l?l+' '+x:x;if(ctx.measureText(t).width>maxw&&l){r.push(l);l=x;}else l=t;});r.push(l);return r;}

var fase=-1;
function frame(f){
  var t=f/FPS;
  var nf=t<T_NUM?0:t<T_FINE?1:2;
  if(nf!==fase){fase=nf;
    if(nf===1)forma(testo(D.n,TEMA,{x:90,y:520,w:900,h:380}),f);
    if(nf===2)forma(marchio(),f);}
  passo(f);

  if(D.sfondo){var SF=hex(D.sfondo),lg0=ctx.createLinearGradient(0,0,W*.35,H);lg0.addColorStop(0,rgb(SF));lg0.addColorStop(.55,rgb(mix(SF,[5,11,23],.55)));lg0.addColorStop(1,'#050B17');ctx.fillStyle=lg0;}else ctx.fillStyle='#050B17';
  ctx.fillRect(0,0,W,H);
  var alone=ease((t-T_SWAP)/.8);
  if(alone>0){var g=ctx.createRadialGradient(W/2,t<T_SU?1000:710,40,W/2,t<T_SU?1000:710,640);g.addColorStop(0,rgb(TEMA,.13*alone));g.addColorStop(1,'rgba(5,11,23,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  for(var i=0;i<N;i++){var p=P[i];ctx.fillStyle=rgb(p.r,p.a.toFixed(2));ctx.beginPath();ctx.arc(p.x,p.y,p.rad,0,6.283);ctx.fill();}

  // titolo: grande al centro, poi sale in alto e si rimpicciolisce
  var u=bez((t-T_SU)/.8), sc=1-.56*u, cy=930+(255-930)*u;
  ctx.save();ctx.translate(W/2,cy);ctx.scale(sc,sc);titolo(t);ctx.restore();
  // data
  var ad=ease((t-T_SWAP-.3)/.5);
  if(ad>0){ctx.globalAlpha=ad;ctx.textAlign='center';ctx.fillStyle=rgb(TENUE);
    var fd=46-12*u;ctx.font='400 '+fd+'px Newsreader';ctx.fillText(D.data,W/2,cy+(260)*sc+20+26*(1-u));ctx.globalAlpha=1;}

  // scheda del dato
  var as=ease((t-T_TESTO)/.5)*(1-ease((t-T_FINE+.2)/.4));
  if(as>0){
    ctx.globalAlpha=as;ctx.textAlign='left';
    font(30,800);ctx.fillStyle=rgb(TEMA);ctx.fillText(D.tema,80,1000);
    ctx.font='400 54px Newsreader';ctx.fillStyle=rgb(BIANCO);
    var rr=a_capo(D.riga,920);rr.forEach(function(l,j){ctx.fillText(l,80,1078+j*68);});
    var y0=1078+rr.length*68+40, mx=Math.max.apply(null,D.barre.map(function(b){return b.v;}));
    D.barre.forEach(function(b,j){
      var y=y0+j*86, cr=b.c==='tema'?TEMA:b.c==='ue'?[126,166,255]:BIANCO, gr=bez((t-T_TESTO-.3-j*.18)/.9);
      font(28,600);ctx.fillStyle=rgb(TENUE);ctx.fillText(b.e,80,y);
      var bw=600*b.v/mx*gr;ctx.fillStyle=rgb(cr,b.c==='tema'?1:.78);ctx.beginPath();ctx.roundRect(80,y+14,Math.max(bw,1),30,15);ctx.fill();
      font(32,800);ctx.fillStyle=rgb(cr);ctx.globalAlpha=as*ease((t-T_TESTO-.6-j*.18)/.4);ctx.fillText(b.t,80+bw+18,y+41);ctx.globalAlpha=as;
    });
    font(26,500);ctx.fillStyle=rgb(TENUE);ctx.fillText(D.fonte,80,y0+D.barre.length*86+30);
    ctx.globalAlpha=1;}

  // chiusura
  var af=ease((t-T_FINE-.6)/.5);
  if(af>0){ctx.globalAlpha=af;ctx.textAlign='center';
    font(60,800);ctx.fillStyle=rgb(BIANCO);ctx.fillText('Un dato al giorno,',W/2,1130);ctx.fillText('con la fonte.',W/2,1206);
    ctx.font='400 42px Newsreader';ctx.fillStyle=rgb(TENUE);ctx.fillText('Ogni martedì: Il dato è tratto™, la settimana in numeri',W/2,1290);
    var bx=W/2-330,by=1360;ctx.fillStyle='#25D366';ctx.beginPath();ctx.roundRect(bx,by,660,116,58);ctx.fill();
    ctx.fillStyle='#04261A';font(42,800);ctx.fillText('Canale WhatsApp · link in bio',W/2,by+72);
    font(30,600);ctx.fillStyle=rgb(TENUE);ctx.fillText('ildatoetratto.it · '+D.sito,W/2,1550);
    ctx.globalAlpha=1;}

  // logo discreto
  var lg=document.getElementById('logo'),lh=64,lw=lg.naturalWidth*lh/lg.naturalHeight;
  ctx.globalAlpha=.85;ctx.drawImage(lg,W-60-lw,H-160,lw,lh);ctx.globalAlpha=1;
  ctx.textAlign='left';font(24,500);ctx.fillStyle='#5E7091';ctx.fillText('Elaborazione Troisi Ricerche',60,H-112);
}
window.FRAMES=FRAMES;
window.pronto=Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('400 50px Newsreader'),new Promise(function(r){var l=document.getElementById('logo');l.complete?r():l.onload=r;})]);
</script></body></html>
